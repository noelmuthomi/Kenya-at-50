body.play::after{content:"";position:fixed;inset:0;background:rgba(12,9,9,.5);z-index:0}
#app{position:relative;z-index:1}
.wrap{width:min(94vw,460px);margin:0 auto;padding:18px 0 30px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.ttl{font:900 italic 44px/.95 Inter;margin:0;letter-spacing:-1px}.mut{color:var(--mut);margin:0;font-size:13px}
h3{margin:14px 0 8px;font-size:13px;color:var(--mut);text-align:left}
.btn{border:0;border-radius:12px;padding:15px 22px;font:800 15px Inter;color:#fff;background:var(--red);box-shadow:0 10px 22px -10px var(--red);cursor:pointer}
.btn.g{background:linear-gradient(90deg,var(--green),#000 55%,var(--red))}.btn:active{transform:scale(.97)}
.gh{background:none;border:0;color:var(--mut);font:700 14px Inter;cursor:pointer;padding:12px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font:700 13px Inter;color:var(--green);cursor:pointer}
.card{background:var(--card);border:1.5px solid var(--green);border-radius:16px;box-shadow:0 22px 50px -22px rgba(0,0,0,.4);width:100%}
.pad{padding:6px 16px 18px}
.seg,.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:700 13px Inter;cursor:pointer}
.seg .on,.chip.on{background:var(--green);border-color:var(--green);color:#fff}
input{width:100%;margin-bottom:6px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:700 14px Inter}
.back{width:min(76vw,300px);aspect-ratio:3/4.3;border:2px solid var(--red);border-radius:22px;overflow:hidden;background:var(--card);display:flex;flex-direction:column;align-items:center;box-shadow:0 26px 50px -24px rgba(0,0,0,.5);animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px) rotate(.6deg)}}
@media(prefers-reduced-motion:reduce){.back{animation:none}}
.shuka{align-self:stretch;height:24px;background:repeating-linear-gradient(90deg,#000 0 3px,transparent 3px 26px),repeating-linear-gradient(90deg,transparent 0 11px,#fff 11px 13px),repeating-linear-gradient(0deg,transparent 0 11px,#fff 11px 13px),var(--red)}
.beads{align-self:stretch;height:10px;background:repeating-linear-gradient(90deg,var(--red) 0 8px,#fff 8px 12px,var(--green) 12px 20px,#000 20px 24px,#e0a526 24px 28px,#fff 28px 32px)}
.back img{width:88px;height:88px;margin-top:14px}.back h1{font:900 italic 38px/.95 Inter;margin:8px 0 4px;letter-spacing:-1px}
.back .tag{font:900 italic 17px Inter;color:var(--red);margin:0}
.rib{background:#000;color:#fff;font:800 11px Inter;padding:8px 14px;margin:12px 0;transform:rotate(-2deg);border-radius:4px;box-shadow:3px 3px 0 var(--red)}
.info{display:flex;align-self:stretch;margin:auto 10px 10px;border:1.5px solid var(--line);border-radius:12px}
.info div{flex:1;padding:8px 2px;font-size:10px;color:var(--mut);border-right:1px solid var(--line)}.info div:last-child{border:0}.info b{display:block;font-size:17px;color:var(--ink)}
.pl{width:min(92vw,380px);padding:8px 14px 18px;margin:0 auto}
.w{display:flex;align-items:center;gap:12px;padding:11px 4px;font-weight:700;font-size:17px;cursor:pointer;text-align:left}
.w+.w{border-top:1px solid var(--line)}.w span{flex:1}
.c{width:17px;height:17px;border:2px solid var(--ink);border-radius:50%;flex:none}
.w.on .c{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 3px var(--card)}.w.on span{opacity:.55;text-decoration:line-through}
.pt{border:1px solid var(--ink);border-radius:999px;font-size:11px;padding:1px 9px}
.hard{color:var(--red)}.hard .pt,.hard .c{border-color:var(--red)}
#tm{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:var(--card);color:var(--red);border-radius:12px;padding:9px 14px;font:800 20px ui-monospace,Menlo,monospace}
#tm.lo{animation:pu .8s infinite}@keyframes pu{50%{background:var(--red);color:#fff}}
.rs{display:grid;gap:16px;width:min(94vw,860px);margin:20px auto;grid-template-columns:1fr}
@media(min-width:760px){.rs{grid-template-columns:1fr 250px;align-items:start}}
.hd{padding:18px;text-align:center;background:linear-gradient(120deg,rgba(0,107,63,.16),rgba(200,16,46,.14));border-radius:14px 14px 0 0}
.hd h2{margin:0 0 4px;font-size:19px}.hd .a{color:var(--red);font:800 18px Inter;margin:2px 0}.hd .t{color:var(--green);font:900 30px Inter}

let S={n:2,names:Array.from({length:10},(_,i)=>'Team '+(i+1)),time:60,goal:300,cats:new Set(Object.keys(D)),teams:[],t:0,card:[],ok:[],used:new Set(),iv:0,dp:null,prev:0};
try{const z=JSON.parse(localStorage.getItem('k50')||'[]');S.used=new Set(z)}catch(e){}
const $=s=>document.querySelector(s),app=$('#app'),tm=$('#tm');
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const rp=()=>S.card.reduce((a,x,i)=>a+(S.ok[i]?x.p:0),0);
const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const sh=a=>a.sort(()=>Math.random()-.5);
function screen(c){clearInterval(S.iv);document.body.className=c||'';tm.hidden=true;window.scrollTo(0,0)}
function draw(){
 let pool=P.filter(x=>S.cats.has(x.k)&&!S.used.has(x.w));
 if(pool.length<10){S.used.clear();pool=P.filter(x=>S.cats.has(x.k))}
 const hd=sh(pool.filter(x=>x.p>10)).slice(0,2),c=[...hd,...sh(pool.filter(x=>x.p==10)).slice(0,10-hd.length)];
 if(c.length<10)c.push(...sh(pool.filter(x=>!c.includes(x))).slice(0,10-c.length));
 c.forEach(x=>S.used.add(x.w));try{localStorage.setItem('k50',JSON.stringify([...S.used]))}catch(e){}
 return sh(c);
}
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!navigator.standalone;
function setup(){screen();
 app.innerHTML=`<div class="wrap"><img src="${IMG}" width="92" height="92" alt="">
 <h1 class="ttl">KENYA<br>AT 50</h1><p class="mut">Guess ten Kenyan words before the clock runs out.</p>
 <div class="card pad"><h3>How many teams or players? (2–10)</h3><div class="seg">${[2,3,4,5,6,7,8,9,10].map(n=>`<button data-a="n" data-v="${n}" class="${S.n==n?'on':''}">${n}</button>`).join('')}</div>
 <h3>Team names</h3>${S.names.slice(0,S.n).map((n,i)=>`<input data-i="${i}" value="${esc(n)}" maxlength="18" aria-label="Team ${i+1} name">`).join('')}
 <h3>Round time</h3><div class="seg">${[45,60,90].map(n=>`<button data-a="tm" data-v="${n}" class="${S.time==n?'on':''}">${n} sec</button>`).join('')}</div>
 <h3>Game length: first to reach</h3><div class="seg">${[100,300,500].map(n=>`<button data-a="goal" data-v="${n}" class="${S.goal==n?'on':''}">${n} pts</button>`).join('')}</div>
 <h3>Categories</h3><div class="chips">${Object.entries(D).map(([k,v])=>`<button class="chip ${S.cats.has(k)?'on':''}" data-a="cat" data-v="${k}">${v[0]}</button>`).join('')}</div>
 <p class="mut mt">${P.filter(x=>S.cats.has(x.k)).length} words in play</p></div>
 <button class="btn g" data-a="begin">Start game</button>
 ${S.dp?'<button class="pill" data-a="inst">⬇ Install app</button>':''}
 ${ios?'<p class="mut">To install on iPhone: tap Share, then “Add to Home Screen”.</p>':''}</div>`}
function back(){return `<div class="back"><div class="shuka"></div><div class="beads"></div><img src="${IMG}" alt=""><h1>KENYA AT 50</h1><p class="tag">The Kenyan word game</p><div class="rib">TEN WORDS · ONE ROUND · NO MERCY</div>
 <div class="info"><div><b>10</b>words</div><div><b>${S.time}s</b>timer</div><div><b>47</b>counties</div></div><div class="beads"></div></div>`}
function turn(){screen();const t=S.teams[S.t];
 app.innerHTML=`<div class="wrap"><button class="pill" data-a="scores">🏆 View Team Scores here</button>
 <div><h2 style="margin:6px 0 2px;font-size:20px">${esc(t.name)}’s Turn</h2><p class="mut">Ready to reveal words and start the timer</p><span class="goal">🎯 First to ${S.goal} pts wins</span></div>${back()}
 <p class="mut" style="font-size:15px">Ready to reveal the words?</p>
 <div class="row"><button class="btn" data-a="start">👁 Reveal words and start timer</button><button class="gh" data-a="end">End Game</button></div></div>`}
function play(){screen('play');S.card=draw();S.ok=Array(10).fill(0);S.end=Date.now()+S.time*1000;
 app.innerHTML=`<div class="wrap" style="padding-top:70px"><div class="card pl">${S.card.map((x,i)=>`<div class="w ${x.p>10?'hard':''}" data-a="tog" data-i="${i}"><i class="c"></i><span>${esc(x.w)}</span><em class="pt" style="font-style:normal">${x.p}</em></div>`).join('')}</div>
 <button class="btn g" data-a="done">Done</button></div>`;
 tm.hidden=false;const tick=()=>{const l=Math.max(0,Math.ceil((S.end-Date.now())/1000));tm.textContent='⏱ '+fmt(l);tm.className=l<=10?'lo':'';if(l<=0){try{navigator.vibrate&&navigator.vibrate(400)}catch(e){}finish()}};tick();S.iv=setInterval(tick,250)}
function finish(){screen();S.prev=S.teams[S.t].score;results()}
const rank=(me)=>[...S.teams].sort((a,b)=>b.score-a.score).map((t,i)=>`<div class="rk ${me&&t===S.teams[S.t]?'me':''}"><b>${i+1}</b><span>${esc(t.name)}</span><i>${t.score} pts</i></div>`).join('');
function results(){const t=S.teams[S.t],r=rp(),n=S.ok.filter(Boolean).length;t.score=S.prev+r;const win=t.score>=S.goal;
 app.innerHTML=`<div class="rs"><div class="card"><div class="hd"><h2>${esc(t.name)}’s Results</h2><p class="mut">Prev: <b style="color:var(--ink)">${S.prev} pts</b></p><p class="a">+${r} pts</p><div class="t">Total: ${t.score} pts</div>${win?`<p class="a" style="margin-top:6px">🏆 Reached ${S.goal} pts — game over!</p>`:`<p class="mut" style="margin-top:6px">${S.goal-t.score} pts to go for ${S.goal}</p>`}</div>
 <div class="rv"><p style="font-weight:800;font-size:14px;margin:0 0 10px;text-align:left">Review your words (tap to fix):</p>${S.card.map((x,i)=>`<div class="w ${x.p>10?'hard':''} ${S.ok[i]?'on':''}" data-a="rtog" data-i="${i}"><i class="c"></i><span>${esc(x.w)}<small>(${x.p} pts)</small></span></div>`).join('')}</div>
 <div class="st"><div><b>${n}</b>Words correct</div><div><b>${r}</b>Round points</div><div><b>${t.score}</b>Team total</div></div>
 <div class="row" style="padding:0 16px 18px">${win?'<button class="btn g" data-a="end">See final result</button>':'<button class="btn g" data-a="next">Start Next Round</button><button class="gh" data-a="end">End Game</button>'}</div></div>
 <div class="card" style="padding:16px"><h3 style="text-align:center;color:var(--ink);margin-top:0">Team Rankings</h3>${rank(1)}</div></div>`}
function final(){screen();const r=[...S.teams].sort((a,b)=>b.score-a.score),tie=r.length>1&&r[0].score==r[1].score;
 app.innerHTML=`<div class="wrap"><div class="trophy">🏆</div><h1 class="ttl" style="font-size:34px">${tie?'It’s a tie!':esc(r[0].name)+' wins!'}</h1><p class="mut">Hongera! Final standings</p><div class="card" style="padding:16px">${rank(0)}</div><button class="btn g" data-a="again">Play again</button></div>`}
const A={
 n:b=>{S.n=+b.dataset.v;setup()},tm:b=>{S.time=+b.dataset.v;setup()},
 goal:b=>{S.goal=+b.dataset.v;setup()},
 cat:b=>{const k=b.dataset.v;S.cats.has(k)?S.cats.delete(k):S.cats.add(k);if(!S.cats.size)S.cats.add(k);setup()},
 begin:()=>{S.teams=S.names.slice(0,S.n).map((n,i)=>({name:n.trim()||'Team '+(i+1),score:0}));S.t=0;turn()},
 start:play,done:finish,
 tog:b=>{const i=+b.dataset.i;S.ok[i]^=1;b.classList.toggle('on',!!S.ok[i])},
 rtog:b=>{S.ok[+b.dataset.i]^=1;results()},
 next:()=>{S.t=(S.t+1)%S.teams.length;turn()},end:final,again:setup,
 scores:()=>{const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card"><h3 style="text-align:center;color:var(--ink);margin-top:0">Team Rankings</h3>${rank(0)}<div class="row"><button class="btn" data-a="x">Close</button></div></div>`;document.body.appendChild(m)},
 x:b=>b.closest('.modal').remove(),inst:()=>{S.dp&&S.dp.prompt()}
};
document.addEventListener('click',e=>{if(e.target.classList.contains('modal'))return e.target.remove();const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b)});
document.addEventListener('input',e=>{if(e.target.dataset.i!==undefined&&e.target.tagName=='INPUT')S.names[+e.target.dataset.i]=e.target.value});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.dp=e;if(!S.teams.length||!document.querySelector('.rs,.back,.pl'))setup()});
setup();
</script></body></html>
